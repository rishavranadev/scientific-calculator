<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
        <title>Scientific calculator</title>
    </head>

    <body>
        <div class="container">
            <h1 class="text-center mt-3">Scientific Calculator</h1>
            <div class="row ">
                <div class="col-12 offset-md-3 col-md-6 ">
                    <div class="card">
                        <div class="card-body">
                            <input 
                            id="calc-display"
                            readonly 
                            class="form-control form-control-lg" 
                            type="text"  
                            aria-label=".form-control-lg example">
                            <div class="row gx-1">
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">{</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">}</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">%</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">AC</button>
                                </div>


                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">7</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">8</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">9</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">÷</button>
                                </div>

                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">4</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">5</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">6</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">×</button>
                                </div>


                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">1</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">2</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">3</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">-</button>
                                </div>


                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">0</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">.</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn  w-100 mt-2 btn-primary border border-primary">=</button>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-light w-100 mt-2 border">+</button>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>    
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous"></script>
        <script src="script.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
    console.log("Document is ready");

    const display = document.getElementById('calc-display');
    const buttons = document.getElementsByClassName('btn');

    let currentValue = "";

    function updateDisplay(val) {
        // Works whether display is an <input> or a <div>/<span>
        if ('value' in display) {
            display.value = val;
        } else {
            display.innerText = val;
        }
    }

    function evaluateResult() {
        if (!currentValue.trim()) return;

        try {

            const sanitizedExpression = currentValue
                .replace(/×/g, "*")
                .replace(/x/g, "*")
                .replace(/÷/g, "/")
                .replace(/%/g,"*0.01" );



            const result = eval(currentValue);
            currentValue = (result !== undefined) ? result.toString() : "";
            updateDisplay(currentValue);
        } catch (error) {
            updateDisplay("Error");
            currentValue = "";
        }
    }

    for (let i = 0; i < buttons.length; i++) {
        const button = buttons[i];
        button.addEventListener('click', function () {
            const value = button.innerText;

            if (value === "AC") {
                currentValue = "";
                updateDisplay(currentValue);
            } else if (value === "=") {
                evaluateResult();
            } else {
                currentValue += value;
                updateDisplay(currentValue);
            }
        });
    }
});
        </script>
    </body>
</html>
